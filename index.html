<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bodha</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            background: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            text-align: center;
            gap: 2.5rem;
        }

        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            max-width: 32rem;
        }

        h1 {
            margin: 0;
            font-size: 2.25rem;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        p.description {
            margin: 0;
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(17, 17, 17, 0.65);
            font-weight: 400;
        }

        .coming-soon {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(17, 17, 17, 0.7);
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(17, 17, 17, 0.1);
            border-radius: 999px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .breathe-wrap {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breathe-circle {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251, 177, 113, 0.85) 0%, rgba(251, 177, 113, 0.35) 40%, rgba(251, 177, 113, 0) 70%);
            filter: blur(6px);
            animation: breathe 8s ease-in-out infinite;
        }

        .breathe-label {
            position: relative;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.06em;
            color: rgba(17, 17, 17, 0.55);
            animation: label-fade 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0% {
                transform: scale(0.7);
            }

            45% {
                transform: scale(1.15);
            }

            50% {
                transform: scale(1.15);
            }

            95% {
                transform: scale(0.7);
            }

            100% {
                transform: scale(0.7);
            }
        }

        @keyframes label-fade {

            0%,
            4% {
                content: "";
            }
        }

        footer {
            font-size: 0.75rem;
            color: rgba(17, 17, 17, 0.35);
        }
    </style>
</head>

<body>
    <header>
        <h1>Bodha</h1>
        <p class="description">A mindfulness companion that helps you observe distractions, return to the present, and
            understand your patterns of attention.</p>
        <span class="coming-soon">Coming Soon</span>

        <div class="breathe-wrap">
            <div class="breathe-circle"></div>
        </div>
    </header>

</body>

</html>
